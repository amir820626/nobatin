# نوبتین — nginx جلوی gunicorn (127.0.0.1:8000)
# نصب:  sudo cp deploy/nginx-nobatin.conf /etc/nginx/sites-available/nobatin
#        sudo ln -s /etc/nginx/sites-available/nobatin /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d example.com -d www.example.com
#
# example.com را با دامنهٔ خودتان عوض کنید و همان را در NOBATIN_TRUSTED_HOSTS بگذارید.
# نام دامنه در این فایل سه بار می‌آید (دو بار server_name و یک بار نشانی ۳۰۱) و
# مسیر گواهی هم یک بار؛ هر چهار یکی باشند.
#
# این فایل از راه sites-enabled داخل بلوک http گنجانده می‌شود، پس دستورهای سطح-http
# مثل server_tokens اینجا مجازند.

# نسخهٔ nginx نباید در هیچ پاسخ بیرونی خوانده شود. سرصفحهٔ Server خودِ اپ با
# «nobatin» بازنویسی می‌شود، ولی خطاهای خودِ nginx (۴۰۰ و ۵۰۲) از این خط پیروی
# می‌کنند.
server_tokens off;

upstream nobatin_app {
    server 127.0.0.1:8000 fail_timeout=5s max_fails=3;
    keepalive 16;
}

# ---------- چرا اینجا set_real_ip_from / real_ip_header نیامده ----------
# ماژول real_ip مقدار $remote_addr را با سرصفحهٔ X-Forwarded-For جایگزین می‌کند؛
# یعنی همان چیزی که در لاگ و در دستورهای allow/deny خوانده می‌شود قابل جعل
# می‌شود: کاربر با هدرِ `X-Forwarded-For: 127.0.0.1` خودش را «درخواستِ داخل سرور»
# جا می‌زند و از قفل loopbackِ /healthz رد می‌شود.
# nginx لبهٔ عمومی است، پس $remote_addr خودش همان IP واقعی مشتری است و چیزی برای
# اصلاح نداریم. اپ هم با ProxyFix (NOBATIN_BEHIND_PROXY=1) آخرین مقدار XFF را
# می‌خواند — و آن مقدار را خودِ nginx افزوده است، پس جعل‌ناپذیر است.
# نتیجه: real_ip خاموش، لاگ درست، /healthz قفل‌شده به loopback واقعی.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # همه‌چیز به HTTPS؛ certbot هم همین مسیر را استفاده می‌کند
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # نام دامنه اینجا ثابت نوشته شده، نه $host. با $host هر Host هدری که به این
    # بلاک برسد در نشانی بازگشت می‌نشیند — مثلاً درخواست مستقیم روی IP سرور، یا
    # هدری که مهاجم برای کاربر فرستاده — و کاربر به `https://evil.com/…`
    # فرستاده می‌شود (بازگشای باز + افشای مسیر درخواست).
    location / { return 301 https://example.com$request_uri; }
}

server {
    # nginx 1.25.1 به بعد: به‌جای کلمهٔ http2 روی listen، دستور `http2 on;`
    # را در همین بلاک بگذارید (شکل قدیمی فقط هشدار می‌دهد، ولی کار می‌کند).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # سقف بدنه: فرم‌های نوبتین چند کیلوبایت‌اند؛ ۱ مگابایت مثل MAX_CONTENT_KB در اپ
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;

    # فشرده‌سازی متن (CSS/JS/HTML) — تصاویر و فونت‌ها لازم نیست
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;

    # فایل‌های ایستا مستقیم از دیسک، با کش بلند. نشانی‌ها ?v=… دارند (asset_url)،
    # پس «یک‌سال» بی‌خطر است: با هر تغییر محتوا، نشانی عوض می‌شود.
    # این پاسخ‌ها از اپ نمی‌گذرند، پس سرصفحه‌های امنیتی‌شان دستی گذاشته می‌شود.
    location /static/ {
        alias /srv/nobatin/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # سلامت: فقط از داخل سرور. (اپ خودش هم /healthz را با IP/توکن قفل کرده است؛
    # این لایهٔ دوم است و به $remote_addr واقعی تکیه می‌کند — بالاتر توضیح داده شد.)
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://nobatin_app;
        proxy_set_header Host localhost;
    }

    location / {
        proxy_pass http://nobatin_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # مقدار خالی یعنی این سرصفحه اصلاً به اپ نمی‌رسد. چرا لازم است: ProxyFix
        # با x_prefix=1 هر X-Forwarded-Prefixِ ارسالی را به script_name تبدیل
        # می‌کند، پس اگر مشتری خودش `X-Forwarded-Prefix: /evil` بفرستد همهٔ
        # نشانی‌هایی که اپ می‌سازد — و پیوند بازگشتِ داخل پیامک‌ها — زیر آن
        # پیشوند می‌روند. ما پیشوندی نداریم، پس سرصفحه را حذف می‌کنیم.
        proxy_set_header X-Forwarded-Prefix "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        # خطای ۵xx از اپ به کاربر نشان داده نمی‌شود؛ صفحهٔ ۵۰۰ خودِ اپ می‌آید
        proxy_intercept_errors off;
    }
}
