name: گزارش خطا
description: یک رفتار نادرست را با مراحل بازتولید گزارش کنید
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ممنون که وقت می‌گذارید. پیش از ساختن Issue، `python smoke_test.py` را
        اجرا کنید؛ اگر آزمون سبز است، احتمالاً مشکل از محیط شماست — آن را هم
        بنویسید. **آسیب‌پذیری امنیتی را اینجا نگذارید**؛ راهنما در
        [`SECURITY.md`](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: چه شد؟
      description: آنچه دیدید، به‌همراه متن خطا یا کد پاسخ.
      placeholder: |
        صفحهٔ /k/arasteh-beauty باز می‌شود ولی ساعت‌های ۱۴:۰۰ غیرفعال‌اند.
        انتظار: با توجه به ساعات کاری فعال باشند.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: مراحل بازتولید
      description: کوچک‌ترین مسیری که خطا را نشان می‌دهد.
      placeholder: |
        1. `python app.py --reset && python app.py`
        2. ورود با 09301234567 و کد ۱۲۳۴۵
        3. باز کردن /k/arasteh-beauty
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: محیط
      options:
        - توسعه (python app.py)
        - production (wsgi.py / gunicorn + nginx)
        - GitHub Actions
        - دیگر
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: نسخهٔ پایتون و Flask
      description: خروجی `python -V` و `pip show flask | head -2`
      placeholder: "Python 3.11.9 / Flask 3.1.3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: لاگ مرتبط
      description: |
        فقط خطوط مرتبط. **شمارهٔ موبایل واقعی، کد OTP یا مقدار NOBATIN_SECRET را
        نچسبانید** — ماسکشان کنید.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: پیش از ارسال
      options:
        - label: "«python smoke_test.py» را اجرا کردم و نتیجه را می‌دانم."
          required: true
        - label: Issue تکراری را در Issues باز/بسته جست‌وجو کردم.
          required: true
        - label: این یک آسیب‌پذیری امنیتی نیست (اگر هست، SECURITY.md را بخوانید).
          required: true
